<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="The Serbian alphabet — Cyrillic and Latin, side by side. With IPA, examples, and translations.">
<title data-i18n="page.alphabet.title" data-i18n-mode="text">The two alphabets — serbian.fyi</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<script src="../assets/theme-init.js"></script>

<link rel="preload" href="/assets/fonts/source-sans-3-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/source-serif-4-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../assets/styles.css">
</head>
<body>

<header class="nav">
  <div class="shell nav-inner">
    <a href="/" class="brand">
      <span data-i18n="nav.brand">serbian.fyi</span>
    </a>
    <div class="nav-actions">
      <div class="nav-controls" role="group" aria-label="Language" data-i18n-attr="aria-label:nav.langGroup">
        <button class="chip" data-lang-chip="en" aria-pressed="true">EN</button>
        <button class="chip" data-lang-chip="ru" aria-pressed="false">RU</button>
      </div>
      <div class="nav-controls script-controls" role="group" aria-label="Serbian script" data-i18n-attr="aria-label:nav.scriptGroup">
        <button class="chip script-chip" data-script-chip="lat" aria-pressed="true" aria-label="Use Latin script" data-i18n-attr="aria-label:script.useLat" data-i18n="script.lat">Latin</button>
        <button class="chip script-chip" data-script-chip="cyr" aria-pressed="false" aria-label="Use Cyrillic script" data-i18n-attr="aria-label:script.useCyr" data-i18n="script.cyr">Cyrillic</button>
      </div>
    </div>
  </div>
</header>

<section class="alph-section">
  <div class="shell">
    <h1 class="sr-only" data-i18n="page.alphabet.h1">The two alphabets</h1>
    <div class="alph-legend">
      <span><span class="alph-mark unique">SR</span><span data-i18n="alph.legend.unique">Unique to Serbian</span></span>
      <span><span class="alph-mark diff">!=</span><span data-i18n="alph.legend.diff">Looks Latin, sounds different</span></span>
    </div>

    <div class="alph-grid" id="alphGrid" aria-label="Serbian alphabet"></div>
  </div>
</section>

<footer class="foot shell">
  <div class="foot-meta">
    <span data-i18n="foot.copy">© <a href="/">serbian.fyi</a> · <a href="https://creativecommons.org/licenses/by/4.0/" rel="license noopener" target="_blank">CC BY 4.0</a></span>
    <span data-i18n="foot.credit">Structure inspired by <a href="https://slev.life/serbian-charts" rel="noopener" target="_blank">Steven Levithan’s Serbian charts</a> · CC BY 4.0</span>
    <span>
      <a href="https://github.com/cwarck/serbian" rel="noopener" target="_blank" data-i18n="foot.repo">Source</a>
      &nbsp;·&nbsp;
      <a href="https://ilyaakimov.com" rel="noopener" target="_blank" data-i18n="foot.author">by Ilya Akimov</a>
    </span>
  </div>
</footer>

<script src="../assets/i18n.js"></script>
<script src="../assets/app.js"></script>
<script src="../data/glossary.js"></script>

<script src="../assets/charts/alphabet-data.js"></script>
<script src="../assets/charts/alphabet.js"></script>
</body>
</html>
